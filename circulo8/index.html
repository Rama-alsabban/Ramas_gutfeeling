/* Layout: one 1600×900 stage scaled to fit; pie construction on the left, story panel on the right.
   On narrow screens the stage crops to the pie and the panel drops below it. */
:root{
  --paper:#ebe9e4;      /* sketchbook page */
  --paper-2:#e2dfd8;
  --ink:#16131c;        /* black marker */
  --accent:#7b35d0;     /* purple marker from the sketches */
  --blue:#1f4aa0;       /* blue ink */
  --guide:#b7b2c2;      /* pencil guide lines */
  --muted:#5d5868;
  --f-display:'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --f-glyph:'Circulo8', serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:var(--f-display);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 40px;
}
main{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
header.top h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1}
header.top h1 span{font-family:var(--f-glyph);font-weight:400;color:var(--accent);margin-left:.35em;font-size:.8em}
header.top p{margin:0;color:var(--muted);font-size:16px;max-width:52ch;text-wrap:balance}

/* ---------- stage ---------- */
.wrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;
  background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;
  background-image:radial-gradient(var(--paper-2) 1.2px, transparent 1.3px);background-size:22px 22px}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.stage svg{position:absolute;inset:0;width:1600px;height:900px;overflow:visible}
.stage .corner{position:absolute;top:44px;font:500 17px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stage .corner.l{left:56px}
.stage .corner.r{right:56px;text-align:right}
.stage .corner b{color:var(--accent);font-weight:500}

/* ---------- story panel ---------- */
.panel{position:absolute;left:930px;top:130px;width:610px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 18px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.ptitle{margin:0;font-size:68px;font-weight:700;letter-spacing:-.025em;line-height:1;text-wrap:balance}
.pbody{margin:0;font-size:25px;line-height:1.42;color:var(--ink);max-width:30ch;text-wrap:pretty}
.now{display:flex;align-items:center;gap:28px;min-height:150px;border-top:1.5px solid var(--ink);padding-top:14px}
.now .L{font-size:150px;font-weight:600;line-height:.9;width:120px;text-align:center}
.now .R{font:400 21px/1.45 var(--f-mono);color:var(--ink)}
.now .R em{font-style:normal;color:var(--accent)}
.tray{display:flex;flex-wrap:wrap;gap:4px 6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px}
.cell .g{font:56px/1 var(--f-glyph);height:46px;display:flex;align-items:flex-end;color:var(--ink)}
.cell .l{font:500 15px/1 var(--f-mono);color:var(--muted);padding-bottom:4px;border-bottom:2px solid transparent}
.cell.cur .g{color:var(--accent)}
.cell.cur .l{color:var(--accent);border-bottom-color:var(--accent)}
.cell.off{opacity:.18}
.fams{display:flex;flex-direction:column;gap:10px;border-top:1.5px solid var(--ink);padding-top:16px}
.fam{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:center}
.fam .n{font:500 16px/1 var(--f-mono);color:var(--accent)}
.fam .t{font-size:22px;font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.fam .t small{font:400 16px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.fam .t i{font:32px/1 var(--f-glyph);font-style:normal;letter-spacing:.08em}

/* ---------- finale ---------- */
.finale{position:absolute;left:110px;top:120px;width:1380px;display:flex;flex-direction:column;gap:26px}
.frow{display:grid;grid-template-columns:280px 1fr;align-items:end;gap:20px;border-bottom:1.5px solid var(--guide);padding-bottom:16px}
.frow .lab{font:500 17px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:14px}
.frow .lab b{display:block;color:var(--accent);font-weight:500}
.frow .cells{display:flex;flex-wrap:wrap;gap:4px 10px}
.frow .cell{width:76px}
.frow .cell .g{font-size:68px;height:56px}
.endcard{position:absolute;left:110px;right:110px;bottom:62px;display:flex;align-items:baseline;justify-content:space-between;gap:30px}
.endcard .name{font-size:92px;font-weight:700;letter-spacing:-.03em;line-height:1}
.endcard .word{font:84px/1 var(--f-glyph);color:var(--accent);letter-spacing:.06em}

/* ---------- compact (phones): crop to the pie, panel below ---------- */
.compact .wrap{aspect-ratio:940/900}
.compact .stage .corner.r{right:auto;left:56px;top:76px;text-align:left}
.compact .finale{left:50px;top:110px;width:840px;gap:14px}
.compact .frow{grid-template-columns:1fr;gap:6px;padding-bottom:10px}
.compact .frow .lab{padding-bottom:0}
.compact .frow .cells{gap:2px 4px}
.compact .frow .cell{width:60px;gap:4px}
.compact .frow .cell .g{font-size:50px;height:40px}
.compact .endcard{left:50px;right:50px;bottom:40px;flex-direction:column;gap:10px;align-items:flex-start}
.compact .endcard .name{font-size:72px}
.compact .endcard .word{font-size:60px}
.panel.below{position:static;width:auto;gap:12px;min-height:400px}
.panel.below .eyebrow{font-size:12px}
.panel.below .ptitle{font-size:32px}
.panel.below .pbody{font-size:17px;max-width:none}
.panel.below .now{min-height:90px;gap:18px}
.panel.below .now .L{font-size:84px;width:70px}
.panel.below .now .R{font-size:14px}
.panel.below .cell{width:44px}
.panel.below .cell .g{font-size:38px;height:32px}
.panel.below .cell .l{font-size:12px}
.panel.below .fam .t{font-size:17px}
.panel.below .fam .t i{font-size:24px}
.panel.below .fam .t small{font-size:12px}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
button{font:500 14px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink);background:transparent;
  border:1.5px solid var(--ink);border-radius:999px;padding:10px 16px;cursor:pointer}
button:hover{background:var(--paper-2)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#play{background:var(--ink);color:var(--paper);min-width:96px}
#play:hover{background:var(--accent);border-color:var(--accent)}
.scrub{flex:1 1 260px;display:flex;align-items:center;gap:12px;min-width:0}
#scrubber{flex:1;min-width:0;accent-color:var(--accent)}
#clock{font:400 14px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{padding:8px 12px;font-size:13px}
.chapters button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.hint{margin:0;font:400 13px/1.4 var(--f-mono);color:var(--muted)}

/* ---------- recording mode (#record) ---------- */
.record body,body.record{padding:0}
body.record main{max-width:none;gap:0}
body.record header.top,body.record .controls,body.record .hint{display:none}
body.record .wrap{border:0;border-radius:0}
</style>

<main>
  <header class="top">
    <h1>Circulo8<span aria-hidden="true">CIRCULO</span></h1>
    <p>How each letter's symbol came out of one circle cut into eight slices, told family by family.</p>
  </header>

  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <svg id="svg" viewBox="0 0 1600 900" role="img" aria-labelledby="svgTitle">
        <title id="svgTitle">Construction of the Circulo8 letters from a circle divided into eight slices</title>
      </svg>
      <div class="corner l">Circulo8 <b>/</b> letter origins</div>
      <div class="corner r" id="cornerR"></div>
      <div class="panel" id="panel" aria-live="polite">
        <div class="eyebrow" id="eyebrow"></div>
        <h2 class="ptitle" id="ptitle"></h2>
        <p class="pbody" id="pbody"></p>
        <div class="now" id="now"><div class="L" id="nowL"></div><div class="R" id="nowR"></div></div>
        <div class="tray" id="tray"></div>
        <div class="fams" id="fams"></div>
      </div>
      <div class="finale" id="finale"></div>
      <div class="endcard" id="endcard">
        <div class="name">Circulo8</div>
        <div class="word" aria-label="Circulo8 written in Circulo8">CIRCULO</div>
      </div>
    </div>
  </div>
  <div id="panelSlot"></div>

  <div class="controls">
    <button id="play" type="button">Pause</button>
    <div class="scrub">
      <input id="scrubber" type="range" min="0" max="100" step="0.01" value="0" aria-label="Animation position">
      <span id="clock">0:00 / 0:00</span>
    </div>
    <div class="chapters" id="chapters"></div>
  </div>
  <p class="hint">Space plays or pauses. The arrow keys jump between chapters.</p>
</main>

<script>
(function(){
'use strict';
const NS = 'http://www.w3.org/2000/svg';

/* ---------- geometry: font units are 1000/em, the pie has radius 300, strokes 20, dots r45 ---------- */
const CX = 470, CY = 470, R = 280, K = R / 300;
const SW = 20 * K, DOT = 45 * K, CAP = 55 * K;
const Q = Math.PI / 4, TAU = Math.PI * 2;
const pt = (a, r = R) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];   // angle clockwise from 12 o'clock
const f = n => n.toFixed(2);

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const seg = (t, start, dur) => ease(clamp((t - start) / dur));
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

/* ---------- svg build ---------- */
const svg = document.getElementById('svg');
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
}
const gGuide = el('g', {});
const guideCircle = el('circle', {cx: CX, cy: CY, r: R, fill: 'none', 'stroke-width': 1.6, 'stroke-dasharray': '3 7', style: 'stroke:var(--guide)'}, gGuide);
const guideRadii = [], nums = [];
for (let i = 0; i < 8; i++) {
  const [x, y] = pt(i * Q);
  guideRadii.push(el('line', {x1: CX, y1: CY, x2: f(x), y2: f(y), 'stroke-width': 1.6, 'stroke-dasharray': '3 7', style: 'stroke:var(--guide)'}, gGuide));
  const [nx, ny] = pt(i * Q, R + 78);
  const t = el('text', {x: f(nx), y: f(ny + 7), 'text-anchor': 'middle', style: 'font:500 21px var(--f-mono);fill:var(--muted)'}, gGuide);
  t.textContent = i + 1;
  nums.push(t);
}
const wedgeAll = el('path', {style: 'fill:var(--accent)', 'fill-opacity': .09});
const wedgeNow = el('path', {style: 'fill:var(--accent)', 'fill-opacity': .2});
const qWedges = [0, 1, 2, 3].map(q => el('path', {style: 'fill:var(--accent)', 'fill-opacity': q % 2 ? .1 : .2}));
const trail = el('path', {fill: 'none', 'stroke-width': 4, 'stroke-linecap': 'round', style: 'stroke:var(--accent)'});
const arrow = el('path', {style: 'fill:var(--accent)'});

const ink = el('g', {fill: 'none', 'stroke-width': f(SW), 'stroke-linecap': 'round', 'stroke-linejoin': 'round'});
const CIRC_LEN = TAU * R;
const circleInk = el('path', {d: `M${CX} ${CY - R}A${R} ${R} 0 1 1 ${CX} ${CY + R}A${R} ${R} 0 1 1 ${CX} ${CY - R}`, 'stroke-dasharray': f(CIRC_LEN)}, ink);
const radii = [0, 1, 2, 3, 4, 5, 6, 7].map(() => el('line', {}, ink));
const caps = [0, 1, 2, 3, 4, 5, 6, 7].map(() => el('line', {}, ink));
const dias = [0, 1, 2, 3].map(() => el('line', {}, ink));
const quarters = [0, 1, 2, 3].map(() => el('path', {}, ink));
const dot = el('circle', {cx: CX, cy: CY, r: 0, stroke: 'none'}, ink);

/* ---------- element setters ---------- */
const INK = 'var(--ink)', ACC = 'var(--accent)';
function show(n, op, color) { n.style.opacity = op; if (color) n.style.stroke = color; }
function line(n, x1, y1, x2, y2, op, color) {
  n.setAttribute('x1', f(x1)); n.setAttribute('y1', f(y1)); n.setAttribute('x2', f(x2)); n.setAttribute('y2', f(y2));
  show(n, op, color);
}
function radius(i, len, op, color, angle) {           // a line from the centre, `len` = 0..1 of R
  const [x, y] = pt(angle == null ? i * Q : angle, R * len);
  line(radii[i], CX, CY, x, y, len > 0.001 ? op : 0, color);
}
function cap(i, p, op, color) {                       // a short bar across the end of line i
  const a = i * Q, [ex, ey] = pt(a), tx = Math.cos(a), ty = Math.sin(a), h = CAP * p;
  line(caps[i], ex - tx * h, ey - ty * h, ex + tx * h, ey + ty * h, p > 0.001 ? op : 0, color);
}
function dia(k, p, op, color) {                       // a diameter from position k to k+4, drawn in direction of travel
  const [x1, y1] = pt(k * Q), [x2, y2] = pt(k * Q + Math.PI);
  line(dias[k], x1, y1, lerp(x1, x2, p), lerp(y1, y2, p), p > 0.001 ? op : 0, color);
}
function arcD(a0, a1, r) {
  if (a1 - a0 < 1e-3) return '';
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M${f(x0)} ${f(y0)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f(x1)} ${f(y1)}`;
}
function wedgeD(a0, a1) {
  if (a1 - a0 < 1e-3) return '';
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${CX} ${CY}L${f(x0)} ${f(y0)}A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f(x1)} ${f(y1)}Z`;
}
function clockwise(a, op) {                           // purple arrow travelling clockwise outside the pie
  const r = R + 40;
  if (a < 0.02 || op <= 0) { trail.setAttribute('d', ''); arrow.setAttribute('d', ''); return; }
  trail.setAttribute('d', arcD(0, a, r));
  const [px, py] = pt(a, r), tx = Math.cos(a), ty = Math.sin(a), nx = Math.sin(a), ny = -Math.cos(a);
  arrow.setAttribute('d', `M${f(px + tx * 14)} ${f(py + ty * 14)}L${f(px - tx * 6 + nx * 10)} ${f(py - ty * 6 + ny * 10)}L${f(px - tx * 6 - nx * 10)} ${f(py - ty * 6 - ny * 10)}Z`);
  trail.style.opacity = op; arrow.style.opacity = op;
}
/* Quarter arcs: control points P1 = c + α·a + β·b, P2 = c + β·a + α·b (a, b = quarter's end vectors).
   (1, .5523) traces the round quarter; (.552, .233) is the inverted curve measured from the O and U glyphs. */
function quarter(q, m, explode, op, color) {
  const a = pt(2 * q * Q), b = pt((2 * q + 2) * Q);
  const ax = a[0] - CX, ay = a[1] - CY, bx = b[0] - CX, by = b[1] - CY;
  const al = lerp(1, .552, m), be = lerp(.5523, .233, m);
  const [ox, oy] = pt((2 * q + 1) * Q, explode * 42); const dx = ox - CX, dy = oy - CY;
  const P = (x, y) => `${f(CX + x + dx)} ${f(CY + y + dy)}`;
  quarters[q].setAttribute('d', `M${P(ax, ay)}C${P(al * ax + be * bx, al * ay + be * by)} ${P(be * ax + al * bx, be * ay + al * by)} ${P(bx, by)}`);
  show(quarters[q], op, color);
  return [dx, dy];
}
function placeDot(x, y, r, op, color) {
  dot.setAttribute('cx', f(x)); dot.setAttribute('cy', f(y)); dot.setAttribute('r', f(Math.max(0, r)));
  dot.style.opacity = r > 0.1 ? op : 0; dot.style.fill = color || INK;
}
function highlight(list) { nums.forEach((n, i) => { const on = list.includes(i); n.style.fill = on ? 'var(--accent)' : 'var(--muted)'; n.style.fontWeight = on ? 600 : 500; }); }

function reset() {
  [...radii, ...caps, ...dias, ...quarters].forEach(n => n.style.opacity = 0);
  circleInk.style.opacity = 0; circleInk.style.stroke = INK; dot.style.opacity = 0;
  [wedgeAll, wedgeNow, ...qWedges].forEach(n => { n.setAttribute('d', ''); n.removeAttribute('transform'); });
  clockwise(0, 0);
  gGuide.style.opacity = 1; ink.style.opacity = 1;
  highlight([]);
}

/* ---------- story data ---------- */
const FAMILIES = [
  {name: 'Rounded vowels', letters: 'UO', note: '4 quarters, inverted'},
  {name: 'Straight letters', letters: 'FHKLMVXYTNWZ', note: 'lines added clockwise'},
  {name: 'Straight vowels', letters: 'AEI', note: 'lines through the centre'},
  {name: 'Round letters', letters: 'BCDGJPQRS', note: 'a dot on the circle'},
];
const STRAIGHT = 'FHKLMVXY';
const STRAIGHT_RECIPE = ['line <em>1</em>', 'lines <em>1–2</em>', 'lines <em>1–3</em>', 'lines <em>1–4</em>', 'lines <em>1–5</em>', 'lines <em>1–6</em>', 'lines <em>1–7</em>', 'all <em>8</em> lines'];
const CAPPED = [
  {ch: 'T', from: 'F', n: 1}, {ch: 'N', from: 'M', n: 5}, {ch: 'W', from: 'V', n: 6}, {ch: 'Z', from: 'X', n: 7},
];
const ROUND = 'CDGJPQRS';

/* step times inside each chapter (seconds) */
const T_STRAIGHT = i => 1.5 + i * 2.2;
const T_CAP = j => 19.6 + j * 2.8;
const T_ROUND = k => 4.3 + k * 1.9;

const CHAPTERS = [
  {id: 'intro', label: 'The pie', dur: 10},
  {id: 'rounded', label: 'Rounded vowels', dur: 13},
  {id: 'straight', label: 'Straight letters', dur: 32},
  {id: 'svowels', label: 'Straight vowels', dur: 13},
  {id: 'round', label: 'Round letters', dur: 22},
  {id: 'all', label: 'All 26', dur: 12},
];
let acc = 0; CHAPTERS.forEach(c => { c.start = acc; acc += c.dur; });
const TOTAL = acc;

/* ---------- panel ---------- */
const $ = id => document.getElementById(id);
const P = {eyebrow: $('eyebrow'), title: $('ptitle'), body: $('pbody'), now: $('now'), nowL: $('nowL'), nowR: $('nowR'), tray: $('tray'), fams: $('fams'), panel: $('panel'), corner: $('cornerR'), finale: $('finale'), end: $('endcard')};
function html(n, h) { if (n._h !== h) { n.innerHTML = h; n._h = h; } }
const cellHTML = (ch, cls) => `<div class="cell ${cls || ''}"><div class="g" aria-hidden="true">${ch}</div><div class="l">${ch}</div></div>`;

P.fams.innerHTML = FAMILIES.map((fm, i) =>
  `<div class="fam"><div class="n">0${i + 1}</div><div class="t">${fm.name}<i aria-hidden="true">${fm.letters}</i><small>${fm.letters.split('').join(' ')}</small></div></div>`).join('');
P.finale.innerHTML = FAMILIES.map((fm, i) =>
  `<div class="frow"><div class="lab"><b>0${i + 1}</b>${fm.name}</div><div class="cells">${fm.letters.split('').map(c => cellHTML(c)).join('')}</div></div>`).join('');
const famRows = [...P.fams.children], finRows = [...P.finale.children];

/* events: [time, letter, recipe] — the latest one at or before lt is "now" */
function current(events, lt) { let cur = null; for (const e of events) if (e[0] <= lt) cur = e; return cur; }
function panel(st, lt) {
  html(P.eyebrow, st.eyebrow); html(P.title, st.title); html(P.body, st.body);
  P.corner.innerHTML = st.corner || '';
  const cur = st.events ? current(st.events, lt) : null;
  P.now.style.display = st.events ? '' : 'none';
  P.tray.style.display = st.tray ? '' : 'none';
  P.fams.style.display = st.fams ? '' : 'none';
  if (st.events) {
    html(P.nowL, cur ? cur[1] : '');
    html(P.nowR, cur ? cur[2] : (st.waiting || ''));
    const p = cur ? seg(lt - cur[0], 0, .35) : 1;
    P.nowL.style.opacity = p; P.nowR.style.opacity = p;
    P.nowL.style.transform = `translateY(${f((1 - p) * 14)}px)`;
  }
  if (st.tray) {
    const done = new Set(st.events.filter(e => e[0] <= lt).map(e => e[1]));
    html(P.tray, st.tray.split('').map(c => cellHTML(c, c === (cur && cur[1]) ? 'cur' : done.has(c) ? '' : 'off')).join(''));
  }
  if (st.fams) famRows.forEach((r, i) => { const p = seg(lt, 5.4 + i * .45, .5); r.style.opacity = p; r.style.transform = `translateX(${f((1 - p) * 20)}px)`; });
  P.panel.style.opacity = st.op == null ? 1 : st.op;
}
const corner = n => `Family <b>${n}</b> / 4`;

/* ---------- scenes ---------- */
const scenes = {
  intro(lt) {
    circleInk.style.opacity = 1;
    circleInk.style.strokeDashoffset = f(CIRC_LEN * (1 - seg(lt, .3, 1.5)));
    const lit = [];
    for (let i = 0; i < 8; i++) {
      const p = seg(lt, 1.9 + i * .4, .45);
      radius(i, p, 1, p < 1 ? ACC : INK);
      if (lt > 1.9 + i * .4) lit.push(i);
    }
    highlight(lit);
    clockwise(clamp((lt - 1.9) / 3.2) * (TAU - .3), 1 - seg(lt, 6.2, .8));
    panel({
      eyebrow: 'Where every letter starts',
      title: 'One circle, eight slices',
      body: 'Each letter of Circulo8 is cut from the same circle, divided like a pie into 8 slices. The slices are counted clockwise from the top. The alphabet then splits into four families.',
      fams: true,
    }, lt);
  },

  rounded(lt) {
    const fadeR = 1 - seg(lt, 0, .9);
    for (let i = 0; i < 8; i++) radius(i, 1, fadeR, INK);
    const explode = seg(lt, 1, 1.2) - seg(lt, 5, 1.2);
    const active = lt > 1 && lt < 6.2;
    for (let q = 0; q < 4; q++) {
      const m = seg(lt, 2.4 + q * .35, 1.4);
      const [dx, dy] = quarter(q, m, explode, 1, active ? ACC : INK);
      qWedges[q].setAttribute('d', wedgeD(2 * q * Q, (2 * q + 2) * Q));
      qWedges[q].setAttribute('transform', `translate(${f(dx)} ${f(dy)})`);
      qWedges[q].style.opacity = clamp(explode * 1.4) * (1 - m);
    }
    placeDot(CX, CY, DOT * back(clamp((lt - 7.5) / .6)), 1, lt < 9 ? ACC : INK);
    highlight(lt > 1 && lt < 6.2 ? [0, 2, 4, 6] : []);
    panel({
      eyebrow: 'Family 1 · Rounded vowels', corner: corner(1),
      title: 'Rounded vowels',
      body: 'O and U take the circle as four slices, one per quarter, and turn each one inside out. The round outline bends inward into a four-pointed star.',
      events: [[5, 'U', '4 quarter slices,<br><em>inverted</em>'], [7.5, 'O', 'the inverted star<br>+ <em>centre point</em>']],
      waiting: 'cutting the circle<br>into <em>4 quarters</em>…',
      tray: 'UO',
    }, lt);
  },

  straight(lt) {
    const out = 1 - seg(lt, 0, .6);                  // the O from the previous chapter fades
    for (let q = 0; q < 4; q++) quarter(q, 1, 0, out, INK);
    placeDot(CX, CY, DOT, out, INK);
    let lit = [];
    if (lt < T_CAP(0)) {
      let hand = 0, last = -1;
      for (let i = 0; i < 8; i++) {
        const t0 = T_STRAIGHT(i);
        if (lt < t0) break;
        last = i;
        const p = seg(lt, t0, .7);
        const isNew = lt < T_STRAIGHT(i + 1);
        if (i === 0) { radius(0, p, 1, isNew ? ACC : INK); hand = 0; }
        else { hand = (i - 1 + p) * Q; radius(i, 1, 1, isNew ? ACC : INK, hand); }
      }
      const fadeOut = 1 - seg(lt, T_CAP(0) - .6, .5);
      if (last >= 0) {
        wedgeAll.setAttribute('d', wedgeD(0, hand)); wedgeAll.style.opacity = fadeOut;
        if (last > 0) { wedgeNow.setAttribute('d', wedgeD((last - 1) * Q, hand)); wedgeNow.style.opacity = fadeOut; }
        clockwise(hand, fadeOut);
        lit = [last];
      }
    } else {
      const j = Math.min(3, Math.floor((lt - T_CAP(0)) / 2.8));
      const prevN = j === 0 ? 8 : CAPPED[j - 1].n, n = CAPPED[j].n;
      const p = seg(lt, T_CAP(j), .5);
      for (let i = 0; i < 8; i++) {
        const was = i < prevN ? 1 : 0, is = i < n ? 1 : 0;
        radius(i, 1, lerp(was, is, p), INK);
      }
      if (j > 0) cap(CAPPED[j - 1].n - 1, 1, 1 - p, ACC);
      cap(n - 1, seg(lt, T_CAP(j) + .6, .5), 1, ACC);
      lit = [n - 1];
    }
    highlight(lit);
    const capPhase = lt >= T_CAP(0) - .3;
    const events = STRAIGHT.split('').map((c, i) => [T_STRAIGHT(i), c, STRAIGHT_RECIPE[i] + '<br>clockwise from the top'])
      .concat(CAPPED.map((c, j) => [T_CAP(j), c.ch, `${c.from} + a <em>bar</em><br>on its last line (${c.n})`]));
    panel({
      eyebrow: 'Family 2 · Straight letters', corner: corner(2),
      title: 'Straight letters',
      body: capPhase
        ? 'Four letters close their newest line with a short bar. T comes from F, N from M, W from V and Z from X.'
        : 'Each letter adds one line from the centre, moving clockwise from the top. A letter keeps every line of the one before it.',
      events, waiting: 'starting at <em>1</em>,<br>12 o’clock', tray: 'FHKLMVXYTNWZ',
    }, lt);
  },

  svowels(lt) {
    const out = 1 - seg(lt, 0, .7);                  // Z fades
    for (let i = 0; i < 7; i++) radius(i, 1, out, INK);
    cap(6, 1, out, ACC);
    let lit = [];
    if (lt < 7.6) {
      const pA = seg(lt, 1, 1.1), oA = 1 - seg(lt, 3.6, .4);
      dia(0, pA, oA, pA < 1 ? ACC : INK);
      const p1 = seg(lt, 4.2, 1), p3 = seg(lt, 4.5, 1), oE = 1 - seg(lt, 7.1, .4);
      dia(1, p1, oE, p1 < 1 ? ACC : INK); dia(3, p3, oE, p3 < 1 ? ACC : INK);
      lit = lt < 1 ? [] : lt < 4.2 ? [0, 4] : [1, 5, 3, 7];
    } else {
      const p0 = seg(lt, 7.8, 1), p2 = seg(lt, 8.1, 1);
      dia(0, p0, 1, p0 < 1 ? ACC : INK); dia(2, p2, 1, p2 < 1 ? ACC : INK);
      lit = [0, 4, 2, 6];
    }
    highlight(lit);
    panel({
      eyebrow: 'Family 3 · Straight vowels', corner: corner(3),
      title: 'Straight vowels',
      body: 'A, E and I skip the slices. Their lines cut straight through the centre, from one edge of the circle to the other.',
      events: [[1, 'A', 'the vertical,<br><em>1</em> through <em>5</em>'], [4.2, 'E', 'both diagonals,<br><em>2–6</em> and <em>4–8</em>'], [7.8, 'I', 'vertical + horizontal,<br><em>1–5</em> and <em>3–7</em>']],
      waiting: 'lines through<br>the <em>centre</em>…', tray: 'AEI',
    }, lt);
  },

  round(lt) {
    const out = 1 - seg(lt, 0, .6);                  // I fades
    dia(0, 1, out, INK); dia(2, 1, out, INK);
    circleInk.style.opacity = 1;
    circleInk.style.strokeDashoffset = f(CIRC_LEN * (1 - seg(lt, .3, 1.3)));
    let x = CX, y = CY, a = 0, lit = [];
    if (lt >= 3.6) {
      const p = seg(lt, 3.6, .7);
      [x, y] = [lerp(CX, pt(0)[0], p), lerp(CY, pt(0)[1], p)];
      if (p >= 1) {
        for (let k = 1; k < 8; k++) a += seg(lt, T_ROUND(k) - .8, .8) * Q;
        [x, y] = pt(a);
        lit = [Math.round(a / Q)];
      }
    }
    const grow = back(clamp((lt - 1.8) / .5));
    placeDot(x, y, DOT * grow, 1, INK);
    clockwise(a, 1);
    if (a > .01) { wedgeNow.setAttribute('d', wedgeD(0, a)); wedgeNow.style.opacity = .5; }
    highlight(lit);
    panel({
      eyebrow: 'Family 4 · Round letters', corner: corner(4),
      title: 'Round letters',
      body: 'The circle stays whole and a dot marks one position. B keeps the dot in the centre. C to S walk it around the rim, one slice at a time, clockwise from the top.',
      events: [[1.8, 'B', 'circle + dot<br>at the <em>centre</em>']].concat(ROUND.split('').map((c, k) => [T_ROUND(k), c, `circle + dot<br>at position <em>${k + 1}</em>`])),
      waiting: 'drawing the<br>whole <em>circle</em>…', tray: 'BCDGJPQRS',
    }, lt);
  },

  all(lt) {
    const out = 1 - seg(lt, 0, .6);
    circleInk.style.opacity = out; circleInk.style.strokeDashoffset = 0;
    placeDot(...pt(7 * Q), DOT, out, INK);
    gGuide.style.opacity = out;
    panel({eyebrow: '', title: '', body: '', op: out}, lt);
  },
};

/* ---------- render ---------- */
let t = 0, playing = true, last = null, mode = '';
const scrub = $('scrubber'), clock = $('clock'), playBtn = $('play');
scrub.max = TOTAL;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const chapBox = $('chapters');
CHAPTERS.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = c.label;
  b.addEventListener('click', () => { t = c.start; render(); });
  chapBox.appendChild(b); c.btn = b;
});
function chapterAt(time) { let c = CHAPTERS[0]; for (const ch of CHAPTERS) if (time >= ch.start) c = ch; return c; }

function render() {
  t = clamp(t, 0, TOTAL);
  const ch = chapterAt(t), lt = t - ch.start;
  reset();
  scenes[ch.id](lt);
  const fin = ch.id === 'all';
  P.finale.style.display = fin ? '' : 'none';
  P.end.style.display = fin ? '' : 'none';
  P.panel.style.display = fin && mode === 'compact' ? 'none' : '';
  if (fin) {
    finRows.forEach((r, i) => {
      const p = seg(lt, .8 + i * .55, .6);
      r.style.opacity = p; r.style.transform = `translateY(${f((1 - p) * 18)}px)`;
      [...r.querySelectorAll('.cell')].forEach((c, k) => { c.style.opacity = seg(lt, .9 + i * .55 + k * .05, .3); });
    });
    const pe = seg(lt, 4.4, .8);
    P.end.style.opacity = pe; P.end.style.transform = `translateY(${f((1 - pe) * 16)}px)`;
    P.corner.innerHTML = '26 letters';
  }
  scrub.value = t;
  clock.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
  CHAPTERS.forEach(c => c.btn.setAttribute('aria-current', c === ch ? 'true' : 'false'));
  playBtn.textContent = playing ? 'Pause' : (t >= TOTAL ? 'Replay' : 'Play');
}

function frame(now) {
  if (playing) {
    if (last != null) t += Math.min(.1, (now - last) / 1000);
    if (t >= TOTAL) { t = TOTAL; playing = false; }
    render();
  }
  last = now;
  requestAnimationFrame(frame);
}

playBtn.addEventListener('click', () => {
  if (t >= TOTAL) t = 0;
  playing = !playing; render();
});
scrub.addEventListener('input', () => { t = +scrub.value; render(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const i = CHAPTERS.indexOf(chapterAt(t));
    const n = CHAPTERS[clamp(i + (e.key === 'ArrowRight' ? 1 : -1), 0, CHAPTERS.length - 1)];
    t = n.start; render();
  }
});

/* ---------- sizing: full stage on wide screens, pie-only stage + panel below on phones ---------- */
const wrap = $('wrap'), stage = $('stage'), slot = $('panelSlot');
const recording = location.hash === '#record';
if (recording) document.body.classList.add('record');
function fit() {
  const w = wrap.clientWidth;
  const compact = !recording && w < 720;
  if (compact !== (mode === 'compact')) {
    mode = compact ? 'compact' : 'wide';
    document.body.classList.toggle('compact', compact);
    if (compact) { slot.appendChild(P.panel); P.panel.classList.add('below'); }
    else { stage.appendChild(P.panel); P.panel.classList.remove('below'); stage.insertBefore(P.panel, P.finale); }
  }
  stage.style.transform = `scale(${w / (compact ? 940 : 1600)})`;
}
new ResizeObserver(fit).observe(wrap);
fit();

if (recording || matchMedia('(prefers-reduced-motion: reduce)').matches) {
  playing = false;
  if (!recording) t = 9;           // rest on the finished pie with the four families listed
}
window.__seek = s => { playing = false; t = s; render(); };
window.__TOTAL = TOTAL;
render();
requestAnimationFrame(frame);
})();
</script>
